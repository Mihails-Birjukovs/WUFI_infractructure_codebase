<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">Source-aware climate reconstruction architecture</title><desc id="desc">Qualify measurements first; if absent choose gap-length and information-set appropriate models; then physical validation and native solver regression.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#587284"/></marker><style>text{font-family:Arial,sans-serif;fill:#1c3447;font-size:17px}.heading{font-size:20px;font-weight:bold}.box{fill:#edf4f7;stroke:#638193;stroke-width:1.5}.arrow{stroke:#587284;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><rect width="1000" height="550" fill="#fff"/><rect x="310" y="18" width="380" height="60" rx="8" class="box"/><text x="500" y="43" text-anchor="middle" class="heading">Missing climate record</text><text x="500" y="64" text-anchor="middle">Source search and physical QC</text><path d="M500 78 V100" class="arrow"/><rect x="310" y="105" width="380" height="60" rx="8" class="box"/><text x="500" y="131" text-anchor="middle" class="heading">Qualified observations?</text><text x="500" y="151" text-anchor="middle">Retain provenance and uncertainty</text><path d="M420 165 V188 H180 V220" class="arrow"/><path d="M580 165 V188 H750 V220" class="arrow"/><text x="244" y="182">Yes</text><text x="682" y="182">No</text><rect x="25" y="225" width="310" height="90" rx="8" class="box"/><text x="180" y="251" text-anchor="middle" class="heading">Observation recovery</text><text x="180" y="275" text-anchor="middle">Original + alternate source</text><text x="180" y="297" text-anchor="middle">No silent bias correction</text><rect x="480" y="225" width="245" height="90" rx="8" class="box"/><text x="602" y="251" text-anchor="middle" class="heading">Outdoor gaps</text><text x="602" y="275" text-anchor="middle">Short: interpolation</text><text x="602" y="297" text-anchor="middle">Long: ERA + Kalman</text><rect x="740" y="225" width="235" height="90" rx="8" class="box"/><text x="857" y="251" text-anchor="middle" class="heading">Indoor gaps</text><text x="857" y="275" text-anchor="middle">M0 / M3 / M7 / M4</text><text x="857" y="297" text-anchor="middle">Pre-only: M1</text><path d="M180 315 V338 H500 V359" class="arrow"/><path d="M602 315 V338 H500" fill="none" stroke="#587284" stroke-width="2"/><path d="M857 315 V338 H602" fill="none" stroke="#587284" stroke-width="2"/><rect x="245" y="365" width="510" height="72" rx="8" class="box"/><text x="500" y="393" text-anchor="middle" class="heading">Joint physical and source validation</text><text x="500" y="418" text-anchor="middle">T, RH, vapour pressure, temporal skill, uncertainty</text><path d="M500 437 V461" class="arrow"/><rect x="245" y="467" width="510" height="64" rx="8" fill="#e4f1e9" stroke="#638b73" stroke-width="1.5"/><text x="500" y="494" text-anchor="middle" class="heading">Native WUFI interface and baseline regression</text><text x="500" y="516" text-anchor="middle">Fixed materials; admit climate only after gates pass</text></svg>