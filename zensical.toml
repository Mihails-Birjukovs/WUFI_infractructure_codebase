[project]
site_name = "WUFI Infrastructure | Tools & Reproducibility"
site_url = "https://mihails-birjukovs.github.io/WUFI_infractructure_codebase/"
site_description = "WUFI infrastructure · INM software, experimental provenance and methodological references"
site_author = "Mihails Birjukovs · Institute of Numerical Modelling, University of Latvia"
copyright = "Copyright © 2026 Mihails Birjukovs"
docs_dir = "site_docs"
site_dir = "site"
extra_css = ["stylesheets/inm-wufi-20261020.css"]
nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "getting-started.md",
    "architecture.md",
    "mathematica.md",
    "python.md",
  ] },
  { "Processing methods" = [
    "climate.md",
    "modal.md",
  ] },
  { "Validation" = "validation.md" },
  { "Scientific data & provenance" = "data-provenance.md" },
  { "Research & references" = "references.md" },
  { "Credits & contributors" = "credits.md" },
  { "Source & contributing" = [
    "source-reference.md",
    "contributing.md",
  ] },
  { "Licensing" = "licensing.md" },
]

[project.theme]
logo = "assets/inm-horizontal.svg"
favicon = "assets/inm-mark.svg"
features = [
  "navigation.instant",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.sections",
  "toc.follow",
  "navigation.top",
]

[project.theme.palette]
scheme = "default"
primary = "custom"
accent = "custom"
