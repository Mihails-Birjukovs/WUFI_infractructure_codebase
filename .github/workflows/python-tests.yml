name: Python tool tests

on:
  push:
    branches:
      - WUFI_python_tools
  pull_request:
    branches:
      - WUFI_python_tools
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python_tools/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r python_tools/requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q python_tools
      - name: Test synthetic invariants
        run: python -m pytest -q python_tools/tests
      - name: Run synthetic climate and modal examples
        run: |
          python -m python_tools.examples.make_synthetic_inputs --out-dir /tmp/wufi_demo
          python python_tools/wac_from_audit.py /tmp/wufi_demo/synthetic_wac_audit.csv /tmp/wufi_demo/synthetic_climate.wac
          python -m python_tools.examples.run_modal_example --out-dir /tmp/wufi_demo
